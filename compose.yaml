services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: common
      POSTGRES_PASSWORD: common-local-only
      POSTGRES_DB: common_test
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U common -d common_test"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["127.0.0.1:4222:4222"]
    volumes: ["nats-data:/data"]
volumes:
  nats-data:
