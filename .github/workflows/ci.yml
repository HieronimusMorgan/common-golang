name: Go checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.4', 'stable']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go build -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race -count=1 -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out
      - run: docker compose up -d --wait
      - run: COMMON_INTEGRATION=1 go test -mod=readonly -race -count=1 ./redis ./nats
      - run: COMMON_POSTGRES_INTEGRATION=1 go test -mod=readonly -tags postgres_integration -race -count=1 ./database
      - if: always()
        run: docker compose down -v
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: git ls-files -z | python3 scripts/check_secret_paths.py
